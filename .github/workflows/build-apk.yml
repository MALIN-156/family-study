name: 构建并发布 APK

# 触发方式:
#  1) 修改仓库根目录的 VERSION 文件并提交(日常更新用这个)
#  2) 在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 读取版本号
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION 必须形如 1.0.1"; exit 1; }
          IFS=. read MA MI PA <<< "$V"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_ENV"

      - name: 写入版本号和更新地址
        run: |
          cat > www/config.js <<JS
          window.APP_CONFIG = { version: "${VERSION_NAME}", repo: "${GITHUB_REPOSITORY}" };
          JS

      - run: npm ci

      - name: 生成 Android 工程并打补丁
        run: |
          npx cap add android
          python3 native/patch_android.py
          npx cap sync android

      - name: 还原签名密钥库
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "缺少 Secret: KEYSTORE_B64(见 README 第 4 步)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 构建签名 APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 整理 APK 文件名
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "没有找到 APK"; exit 1; }
          cp "$APK" "family-study-${VERSION_NAME}.apk"
          ls -l family-study-*.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: 家庭学习 ${{ env.VERSION_NAME }}
          files: family-study-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
